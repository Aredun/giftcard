<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <title>Tarjeta regalo de Navidad · ULTEBRA</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
</head>
<body>
  <header class="site-header">
    <p class="wordmark">ULTEBRA Solutions S.L.</p>
  </header>

  <main id="main" class="site-main">
    <noscript>
      <div class="notice">
        <p lang="es">Esta página necesita JavaScript para generar tu código de selección. Actívalo o usa un navegador actual.</p>
        <p lang="en">This page needs JavaScript to generate your selection code. Please enable it or use a current browser.</p>
        <p lang="de">Diese Seite braucht JavaScript, um deinen Auswahlcode zu erzeugen. Bitte aktiviere es oder nutze einen aktuellen Browser.</p>
      </div>
    </noscript>

    <section id="state-choose" class="state" aria-labelledby="state-choose-heading">
      <h1 id="state-choose-heading" class="visually-hidden">Elige tu tarjeta regalo de Navidad</h1>
    </section>

    <section id="state-email" class="state" aria-labelledby="state-email-heading" hidden>
      <h1 id="state-email-heading" class="visually-hidden">Generar código</h1>
    </section>

    <section id="state-result" class="state" aria-labelledby="state-result-heading" hidden>
      <h1 id="state-result-heading" class="visually-hidden">Tu código de selección está listo</h1>
    </section>
  </main>

  <footer class="site-footer">
    <p>ULTEBRA Solutions S.L.</p>
  </footer>
</body>
</html>
